<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Leituras RFID</title>
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>

<nav class="navbar">
<a href="/">Início</a>
<a href="/cadastrar">Cadastrar Moto</a>
<a href="/leituras">Leituras</a>
<a href="/importar">Importar arquivos</a>
<a href="/relatorios">Relatórios</a>
<a href="/ler">Simular Leitura</a>
</nav>

<div class="container">
<div class="card">

<h1>Histórico de Leituras</h1>

<table>
<thead>
<tr>
<th>TAG RFID</th>
<th>DATA/HORA</th>
</tr>
</thead>

<tbody>
{% for leitura in leituras %}
<tr>
<td>{{ leitura.tag_rfid }}</td>
<td>{{ leitura.data_hora }}</td>
</tr>
{% endfor %}
</tbody>
</table>

</div>
</div>

</body>
</html>
