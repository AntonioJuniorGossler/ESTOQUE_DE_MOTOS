<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Moto</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <!-- ==========================================
         MENU
    =========================================== -->

    <nav class="navbar">
        <a href="/">Início</a>
        <a href="/cadastrar">Cadastrar Moto</a>
        <a href="/leituras">Leituras</a>
        <a href="/importar">Importar arquivos</a>
        <a href="/relatorios">Relatórios</a>
        <a href="/ler">Simular Leitura</a>
    </nav>


    <!-- ==========================================
         CONTEÚDO
    =========================================== -->

    <div class="container">

        <div class="card card-small">

            <h1>Cadastro de Moto</h1>


            <!-- ==========================================
                 MENSAGENS DO FLASK
            =========================================== -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for categoria, mensagem in messages %}

                        <script>
                            alert("{{ mensagem }}");
                        </script>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- ==========================================
                 FORMULÁRIO
            =========================================== -->

            <form method="POST" action="/cadastrar">


                <!-- ==========================================
                     TAG RFID
                =========================================== -->

                <div class="form-group">

                    <label for="tag">
                        TAG RFID (1 a 10)
                    </label>

                    <input
                        type="number"
                        id="tag"
                        name="tag"
                        min="1"
                        max="10"
                        required
                    >

                </div>


                <!-- ==========================================
                     MONTADOR
                =========================================== -->

                <div class="form-group">

                    <label for="montador">
                        Montador
                    </label>

                    <select
                        id="montador"
                        name="montador"
                        required
                        style="width:100%; height:48px; display:block; border:1px solid #ccc; border-radius:8px;"
                    >

                        <option value="">
                            Selecione o Montador
                        </option>

                        <option value="JOAO">
                            JOAO
                        </option>

                        <option value="THIAGO">
                            THIAGO
                        </option>

                    </select>

                </div>


                <!-- ==========================================
                     MODELO
                =========================================== -->

                <div class="form-group">

                    <label for="modelo">
                        Modelo
                    </label>

                    <select
                        id="modelo"
                        name="modelo"
                        required
                        style="width:100%; height:48px; display:block; border:1px solid #ccc; border-radius:8px;"
                    >

                        <option value="">
                            Selecione o Modelo
                        </option>

                        <option value="CG160 FAN">
                            CG160 FAN
                        </option>

                        <option value="CG160 TITAN">
                            CG160 TITAN
                        </option>

                        <option value="CG160 TITAN 50 ANOS">
                            CG160 TITAN 50 ANOS
                        </option>

                        <option value="CG160START">
                            CG160 START
                        </option>

                        <option value="BIZ ES">
                            BIZ ES
                        </option>

                        <option value="BIZ EX">
                            BIZ EX
                        </option>
                        <option value="BIZ KUROMI">
                            BIZ KUROMI
                        </option>

                        <option value="POP 110I">
                            POP 110I
                        </option>

                        <option value="BROS">
                            BROS
                        </option>

                        <option value="XRE 190">
                            XRE 190
                        </option>

                        <option value="XRE 190 ADV">
                            XRE 190 ADV
                        </option>

                        <option value="CB 300F ABS">
                            CB 300F ABS
                        </option>

                        <option value="CB 300F TWISTER ABS S">
                            CB 300F TWISTER ABS S
                        </option>

                        <option value="CB 300F CBS">
                            CB 300F CBS
                        </option>

                        <option value="XRE 300 SAHARA STANDARD">
                            XRE 300 SAHARA STANDARD
                        </option>

                        <option value="XRE 300 SAHARA RALLY">
                            XRE 300 SAHARA RALLY
                        </option>

                        <option value="XRE 300 SAHARA ADV">
                            XRE 300 SAHARA ADV
                        </option>

                        <option value="XR 300L TORNADO">
                            XR 300L TORNADO
                        </option>

                        <option value="PCX 160 ABS">
                            PCX 160 ABS
                        </option>

                        <option value="PCX 160 CBS">
                            PCX 160 CBS
                        </option>

                        <option value="ADV 160">
                            ADV 160
                        </option>

                        <option value="PCX 160 DLX ABS">
                            PCX 160 DLX ABS
                        </option>
                    </select>

                </div>


                <!-- ==========================================
                     COR
                =========================================== -->
                <div class="form-group">
                    <label for="cor">Cor</label>
                    <select id="cor" name="cor" required style="width:100%; height:48px; display:block; border:1px solid #ccc; border-radius:8px;">
                        <option value="">Selecione a Cor</option>
                        <option value="AZUL">AZUL</option>
                        <option value="AZUL ESC P">AZUL ESCURO PEROLIZADA</option>
                        <option value="AZUL METÁLICA">AZUL METÁLICA</option>
                        <option value="AZUL PEROLIZADA">AZUL PEROLIZADA</option>
                        <option value="BEGE METALICA">BEGE METÁLICA</option>
                        <option value="BRANCA">BRANCA</option>
                        <option value="BRANCA PER">BRANCA PEROLIZADA</option>
                        <option value="CINZA">CINZA</option>
                        <option value="CINZA PEROL">CINZA PEROLIZADA</option>
                        <option value="PRATA MET">PRATA METALICA</option>
                        <option value="CINZA METALICO">CINZA METÁLICA</option>
                        <option value="PRETA">PRETA</option>
                        <option value="PRETA METALIC">PRETA METÁLICA</option>
                        <option value="ROXA FOSCO">ROXA FOSCO</option>
                        <option value="VERMELHA">VERMELHO</option>
                        <option value="VERM.FOSCO">VERMELHA FOSCA</option>
                        <option value="VERM.PEROL">VERMELHO PEROLIZADA</option>
                        <option value="VERMELHOMET">VERMELHO METALICA</option>
                        <option value="LARANJA">LARANJA</option>
                    </select>
                </div>
                <!-- ==========================================
                     ANO
                =========================================== -->

                <div class="form-group">

                    <label for="ano">
                        Ano (Ex.: 2025/2026)
                    </label>

                    <input
                        type="text"
                        id="ano"
                        name="ano"
                        placeholder="2025/2026"
                        required
                    >

                </div>


                <!-- ==========================================
                     CHASSI
                =========================================== -->

                <div class="form-group">

                    <label for="chassi">
                        Chassi
                    </label>

                    <input
                        type="text"
                        id="chassi"
                        name="chassi"
                        placeholder="Digite o chassi"
                        required
                    >
                </div>
                <!-- ==========================================
                     BOTÃO
                =========================================== -->

                <button type="submit">
                    Cadastrar Moto
                </button>


            </form>

        </div>

    </div>

</body>

</html>
